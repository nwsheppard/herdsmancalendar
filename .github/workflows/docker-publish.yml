name: Build and publish Docker image

# Builds Docker/Dockerfile (context = repo root, same as the manual
# instructions in Docker/README.md) and pushes it to Docker Hub. See the
# repo root's setup instructions for the one-time steps this workflow
# depends on (DOCKERHUB_USERNAME/DOCKERHUB_TOKEN repo secrets) -- without
# those, every run below fails at the "Log in to Docker Hub" step.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      # Only rebuild when something that actually affects the image
      # changes -- not on every commit to the repo (ESP32 firmware work,
      # docs, etc. shouldn't trigger a Docker Hub push).
      - "LXC/calendar_api.py"
      - "LXC/requirements.txt"
      - "Docker/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {} # manual "Run workflow" button, for a rebuild with no source change

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/herdsman-calendar
          tags: |
            # main branch -> :latest
            type=raw,value=latest,enable={{is_default_branch}}
            # v1.2.3 tag -> :1.2.3 (and :1.2, :1 -- semver's usual convention)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          # arm64 included deliberately -- this image's whole reason for
          # existing is "people who don't have Proxmox," which in practice
          # skews toward home-lab setups (Raspberry Pi and similar ARM
          # SBCs are common there), not just amd64 servers.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
