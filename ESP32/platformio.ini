; Herdsman Trading Terminal -- Elecrow CrowPanel 5.0" HMI (ESP32-S3-WROOM-1-N4R8)
;
; Board/library pins here match Elecrow's own verified working example
; (github.com/Elecrow-RD/CrowPanel-5.0-HMI-ESP32-Display-800x480,
; example/V3.0/PlatformIO50) as of 2026-07.
;
; LovyanGFX is vendored under lib/LovyanGFX (not pulled from the registry):
; Elecrow's example depends on a patched fork -- their Bus_RGB has
; getFrameBuffer()/presentFrameBuffer() methods that don't exist in stock
; upstream lovyan03/LovyanGFX, despite library.json claiming version
; 1.2.21. Confirmed by trying the plain registry version first and hitting
; "no member named 'presentFrameBuffer'" at compile time. The vendored copy
; excludes LovyanGFX's bundled CJK bitmap fonts (~120MB, unused here since
; text rendering goes through LVGL, not LovyanGFX's own font API).

[platformio]
src_dir = src
boards_dir = .

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1-myboard
framework = arduino
board_build.partitions = huge_app.csv
; Update these to match whatever COM/tty the board actually enumerates as.
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
lib_deps =
	lvgl/lvgl@9.1.0
	bblanchon/ArduinoJson@^7.2.0
build_flags =
	-D LV_CONF_SKIP
	-D LV_KCONFIG_IGNORE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_COLOR_DEPTH=16
	-D LV_USE_LOG=1
	-D LV_LOG_LEVEL=LV_LOG_LEVEL_WARN
	-D LV_FONT_UNSCII_16=1
	-D LV_FONT_MONTSERRAT_14=1
	-D LV_FONT_MONTSERRAT_20=1
	-D LV_FONT_DEFAULT=\&lv_font_montserrat_14
	-I./include
